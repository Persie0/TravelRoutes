<!doctype html>
<html><head><meta charset="utf-8"><title>Norway West Coast Route</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#map{height:100%;margin:0} .legend{background:white;padding:8px;line-height:1.4}</style>
</head><body><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([64.5,10],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:18, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);
const colors={road:'#e6550d',train:'#377eb8',ferry:'#984ea3',flight:'#1b9e77'};
Promise.all([fetch('stops.geojson').then(r=>r.json()),fetch('route.geojson').then(r=>r.json())]).then(([stops,route])=>{
 const routeLayer=L.geoJSON(route,{style:f=>{
   const m=(f.properties.mode||'road').toLowerCase();
   const key=m.includes('train')?'train':m.includes('ferry')?'ferry':m.includes('flight')?'flight':'road';
   return {color:colors[key],weight:4,dashArray:key==='road'?null:'8 6'};
 }}).addTo(map);
 const stopLayer=L.geoJSON(stops,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:7,fillOpacity:.9}),
   onEachFeature:(f,l)=>l.bindPopup(`<b>${f.properties.order}. ${f.properties.name}</b>`)
 }).addTo(map);
 map.fitBounds(stopLayer.getBounds().pad(.08));
});
</script></body></html>
