const s=[

const map=L.map('map').setView([41.1,-6.2],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const by={};s.forEach(p=>{by[p[1]]=p;L.marker([p[2],p[3]]).addTo(map).bindPopup(`<b>${p[0]}. ${p[1]}</b>`)});
function line(names,opt){L.polyline(names.map(n=>[by[n][2],by[n][3]]),opt).addTo(map)}
line(['Faro','Lagos','Lisbon','Coimbra','Porto'],{weight:4,dashArray:'8,7'});line(['Lisbon','Sintra','Lisbon'],{weight:3,dashArray:'4,6'});line(['Porto','Viana do Castelo','Vigo','Santiago de Compostela','Fisterra / Costa da Morte','A Coruña','Praia das Catedrais / Ribadeo','Cudillero','Oviedo','Covadonga / Cangas de Onís','Arenas de Cabrales / Ruta del Cares','Potes / Picos de Europa','Santillana del Mar','Santander','Bilbao'],{weight:4});line(['Vigo','Cíes Islands','Vigo'],{weight:3,dashArray:'3,7'});line(['Bilbao','San Juan de Gaztelugatxe','Bilbao'],{weight:3});line(['Bilbao','Burgos','León','Bragança','Peso da Régua / Douro','Porto'],{weight:4});
const lg=L.control({position:'bottomleft'});lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Faro → Porto → Bilbao → Porto</b><br>Dashed: public transport<br>Solid: rental car<br>Dotted: ferry/day trip<br><small>Lines are planning connectors, not exact road geometry.</small>';return d};lg.addTo(map);
</script></body></html>
