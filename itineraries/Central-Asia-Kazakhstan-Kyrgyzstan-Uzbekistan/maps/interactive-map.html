<!doctype html><meta charset="utf-8"><title>Central Asia route</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>#m{height:96vh}</style><div id="m"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const m=L.map('m').setView([41.5,70],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(m);fetch('stops.geojson').then(r=>r.json()).then(g=>L.geoJSON(g,{onEachFeature:(f,l)=>l.bindPopup(f.properties.order+'. '+f.properties.name)}).addTo(m));fetch('route.geojson').then(r=>r.json()).then(g=>L.geoJSON(g,{style:{weight:4}}).addTo(m));</script>
