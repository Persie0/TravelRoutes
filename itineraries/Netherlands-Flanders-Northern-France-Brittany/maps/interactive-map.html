<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Netherlands → Flanders → Brittany route</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynZ2gbMZbMZcHNRuDqcBj0uCQE6s=" crossorigin=""><style>html,body,#map{height:100%;margin:0} .legend{background:white;padding:8px 10px;line-height:1.5;box-shadow:0 1px 4px #777}.sw{display:inline-block;width:28px;border-top:3px solid;margin-right:7px;vertical-align:middle}.rail{border-color:#377eb8;border-top-style:dashed}.road{border-color:#e6550d}.local{border-color:#984ea3;border-top-style:dotted}</style></head><body><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>const map=L.map('map').setView([49.8,0],6);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const style=f=>{const m=(f.properties.mode||'').toLowerCase();if(m.includes('train'))return{color:'#377eb8',weight:4,dashArray:'8 6'};if(m.includes('ferry'))return{color:'#984ea3',weight:4,dashArray:'2 7'};return{color:'#e6550d',weight:4}};Promise.all([fetch('stops.geojson').then(r=>r.json()),fetch('route.geojson').then(r=>r.json())]).then(([stops,route])=>{const r=L.geoJSON(route,{style}).addTo(map);L.geoJSON(stops,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:7,color:'#fff',weight:2,fillColor:'#c83e2d',fillOpacity:1}),onEachFeature:(f,l)=>l.bindTooltip(`${f.properties.order}. ${f.properties.name}`,{permanent:false})}).addTo(map);map.fitBounds(r.getBounds().pad(.08));});const legend=L.control({position:'bottomleft'});legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Transport</b><br><span class="sw rail"></span>rail / coach<br><span class="sw road"></span>rental car<br><span class="sw local"></span>local ferry/day trip<br><small>Route lines are planning connectors.</small>';return d};legend.addTo(map);</script></body></html>
